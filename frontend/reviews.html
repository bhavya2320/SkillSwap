<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reviews | SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body data-protected="true" data-page="reviews">
    <header class="navbar"><a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">✳</span><span>SkillSwap</span></a><nav class="nav-links" aria-label="Main navigation"><a href="dashboard.html">Dashboard</a><a href="search.html">Discover</a><a href="skills.html">My skills</a><a href="requests.html">Requests</a><a href="messages.html">Messages</a><a href="sessions.html">Sessions</a></nav><div class="nav-actions"><a href="profile.html" class="nav-user" data-profile-link data-user-name>Profile</a><button class="button button-secondary" type="button" data-logout>Log out</button></div></header>
    <main class="page-shell">
        <div class="page-heading"><p class="section-label">REFLECT AND RECOGNIZE</p><h1>Session reviews</h1><p>Review a participant after a completed session. Each participant can submit one review per session.</p></div>
        <p id="pageMessage" class="notice" hidden role="status" aria-live="polite"></p>
        <div class="content-grid">
            <section><h2>Your reviews</h2><div id="reviewsList" class="stack"><p class="loading-state">Loading reviews…</p></div></section>
            <section class="form-card">
                <h2>Write a review</h2>
                <form id="reviewForm">
                    <div class="form-group"><label for="reviewSession">Completed session</label><select id="reviewSession" required><option value="">Loading sessions…</option></select></div>
                    <div class="form-group"><label for="reviewRating">Rating</label><select id="reviewRating" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Great</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Needs improvement</option></select></div>
                    <div class="form-group"><label for="reviewComment">Comment (optional)</label><textarea id="reviewComment" maxlength="1000"></textarea></div>
                    <button type="submit" class="button">Submit review</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
