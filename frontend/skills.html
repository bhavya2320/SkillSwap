<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My skills | SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body data-protected="true" data-page="skills">
    <header class="navbar"><a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">✳</span><span>SkillSwap</span></a><nav class="nav-links" aria-label="Main navigation"><a href="dashboard.html">Dashboard</a><a href="search.html">Discover</a><a href="skills.html" aria-current="page">My skills</a><a href="requests.html">Requests</a><a href="messages.html">Messages</a><a href="sessions.html">Sessions</a></nav><div class="nav-actions"><a href="profile.html" class="nav-user" data-profile-link data-user-name>Profile</a><button class="button button-secondary" type="button" data-logout>Log out</button></div></header>
    <main class="page-shell">
        <div class="page-heading"><p class="section-label">WHAT YOU KNOW AND WANT TO KNOW</p><h1>Manage your skills</h1><p>List skills you can teach and the skills you want to learn. Your listings power discovery and swap requests.</p></div>
        <p id="pageMessage" class="notice" hidden role="status" aria-live="polite"></p>
        <div class="content-grid">
            <section class="stack"><h2>Your skill listings</h2><div id="skillsList" class="stack"><p class="loading-state">Loading skills…</p></div></section>
            <section class="form-card">
                <h2>Add a skill</h2>
                <form id="skillForm">
                    <div class="form-group"><label for="skillName">Skill name</label><input id="skillName" type="text" maxlength="100" required></div>
                    <div class="form-group"><label for="skillType">I want to…</label><select id="skillType" required><option value="teach">Teach this skill</option><option value="learn">Learn this skill</option></select></div>
                    <div class="form-group"><label for="skillLevel">Level</label><select id="skillLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
                    <div class="form-group"><label for="skillDescription">Short description (optional)</label><textarea id="skillDescription" maxlength="500"></textarea></div>
                    <button type="submit" class="button">Add skill</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
